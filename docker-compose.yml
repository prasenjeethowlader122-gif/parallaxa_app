version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: socialapp_db
    environment:
      POSTGRES_USER: socialapp
      POSTGRES_PASSWORD: socialapp_secret
      POSTGRES_DB: socialapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialapp -d socialapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialapp_api
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://socialapp:socialapp_secret@postgres:5432/socialapp
      JWT_SECRET: your-production-secret-change-this-in-production
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
