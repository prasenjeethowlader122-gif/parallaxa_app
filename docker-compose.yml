version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: socialapp_db
    environment:
      POSTGRES_USER: socialapp
      POSTGRES_PASSWORD: socialapp_secret
      POSTGRES_DB: socialapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialapp -d socialapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.java
    container_name: socialapp_api
    ports:
      - "8080:8080"
      - "9092:9092"
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/socialapp
      DATABASE_USER: socialapp
      DATABASE_PASSWORD: socialapp_secret
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
