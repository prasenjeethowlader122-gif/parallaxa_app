name: Shorebird OTA Update

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  patch:
    name: Shorebird Patch
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Shorebird
        run: |
          curl -L https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          echo "$HOME/.shorebird/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: artifacts/social-flutter-app
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: artifacts/social-flutter-app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Shorebird Patch
        working-directory: artifacts/social-flutter-app
        run: shorebird patch android --force
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
