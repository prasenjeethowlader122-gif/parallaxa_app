name: Flutter Build APK

on:
  push:
    branches:
      - nomain
      - nomaster
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # You can specify a version if needed, e.g., flutter-version: '3.19.0'

      - name: Install dependencies
        working-directory: artifacts/social-flutter-app
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: artifacts/social-flutter-app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        working-directory: artifacts/social-flutter-app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: artifacts/social-flutter-app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/social-flutter-app/build/app/outputs/flutter-apk/app-release.apk
          name: "Flutter Social App ${{ github.ref_name }}"
          body: |
            # 🚀 Flutter Social App Release — `${{ github.ref_name }}`

            Automatically generated release for Flutter-based social application.

            ## 🛠 Build Information
            - **Commit SHA:** `${{ github.sha }}`
            - **Workflow Run:** [View on GitHub](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ## 📦 Installation
            1. Download `app-release.apk` from the Assets below.
            2. Install on your Android device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
