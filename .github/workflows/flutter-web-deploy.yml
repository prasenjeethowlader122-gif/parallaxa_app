name: Flutter Web Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: artifacts/social-flutter-app
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: artifacts/social-flutter-app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        working-directory: artifacts/social-flutter-app
        run: flutter build web --release --base-href /social-app/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: artifacts/social-flutter-app/build/web
          branch: gh-pages
