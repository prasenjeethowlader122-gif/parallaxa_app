name: Shorebird Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Shorebird Release (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: artifacts/social-flutter-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Shorebird Release (Android)
        run: shorebird release android
        env:
          SHOREBIRD_TOKEN: sb_api_h_hoa9KjK0CNm0J5FxiwlFLV87jHjSTkLPgH4DIPTDg

      # ✅ Build APK separately after the Shorebird release
      - name: Build APK
        run: flutter build apk --release

      # ✅ Upload APK as a workflow artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: artifacts/social-flutter-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
