name: Shorebird OTA Patch

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  patch:
    name: Shorebird Patch
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: artifacts/social-flutter-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Shorebird Patch (Android)
        # --release-version=latest targets the most recent published release.
        # Remove this flag only if you want to pin a specific version.
        run: |
          shorebird patch android \
            --release-version=latest \
            --allow-native-diffs \
            --allow-asset-diffs
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
