name: Expo EAS Over-the-Air Update

on:
  push:
    branches:
      - main        # Publishes to "production" channel
      - master      # Publishes to "staging" channel
      - develop     # Publishes to "development" channel
  workflow_dispatch:
    inputs:
      channel:
        description: "EAS Update channel to publish to"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
          - development
      message:
        description: "Update message / release notes"
        required: false
        default: "Manual OTA update"

concurrency:
  group: ota-update-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────
  # 1. Determine which EAS channel to target
  # ─────────────────────────────────────────────
  resolve-channel:
    name: Resolve EAS Channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.set-channel.outputs.channel }}
      message: ${{ steps.set-channel.outputs.message }}
      slack_enabled: ${{ steps.set-channel.outputs.slack_enabled }}

    steps:
      - name: Set channel and message
        id: set-channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "channel=${{ github.event.inputs.channel }}" >> "$GITHUB_OUTPUT"
            echo "message=${{ github.event.inputs.message }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "channel=production" >> "$GITHUB_OUTPUT"
            echo "message=Production update from commit ${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "channel=staging" >> "$GITHUB_OUTPUT"
            echo "message=Staging update from commit ${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "channel=development" >> "$GITHUB_OUTPUT"
            echo "message=Dev update from commit ${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

          # Resolve Slack availability here — secrets cannot be referenced in `if:` expressions;
          # they always evaluate to empty string in that context.
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "slack_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "slack_enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ─────────────────────────────────────────────
  # 2. Publish the OTA update via EAS Update
  # ─────────────────────────────────────────────
  publish-update:
    name: Publish EAS Update (${{ needs.resolve-channel.outputs.channel }})
    runs-on: ubuntu-latest
    needs: resolve-channel
    environment: ${{ needs.resolve-channel.outputs.channel }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install EAS CLI
        run: pnpm add -g eas-cli

      - name: Verify environment variables
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "❌ Error: EXPO_TOKEN is not set"
            echo "Please add EXPO_TOKEN secret to your repository settings"
            exit 1
          fi
          echo "✅ EXPO_TOKEN is configured"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Authenticate with Expo
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        id: eas-update
        run: |
          set +e  # Don't exit on error, we'll handle it

          # --json is omitted: not reliably supported across eas-cli versions
          OUTPUT=$(eas update \
            --channel "${{ needs.resolve-channel.outputs.channel }}" \
            --message "${{ needs.resolve-channel.outputs.message }}" \
            --non-interactive 2>&1)

          EXIT_CODE=$?

          echo "$OUTPUT"

          if [ $EXIT_CODE -eq 0 ]; then
            UPDATE_ID=$(echo "$OUTPUT" | grep -oP '(?<=Update group ID: )\S+' || echo "unknown")
            echo "update_id=$UPDATE_ID" >> "$GITHUB_OUTPUT"
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "update_id=N/A" >> "$GITHUB_OUTPUT"
            echo "success=false" >> "$GITHUB_OUTPUT"
            SAFE_OUTPUT=$(echo "$OUTPUT" | tail -c 2000)
            echo "error_output=$SAFE_OUTPUT" >> "$GITHUB_OUTPUT"
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Print update summary
        if: success()
        run: |
          echo "✅ OTA update published!"
          echo "   Channel  : ${{ needs.resolve-channel.outputs.channel }}"
          echo "   Update ID: ${{ steps.eas-update.outputs.update_id }}"
          echo "   Commit   : ${{ github.sha }}"

      - name: Print error summary
        if: failure()
        run: |
          echo "❌ OTA update failed!"
          echo "   Channel: ${{ needs.resolve-channel.outputs.channel }}"
          echo "   Error  : ${{ steps.eas-update.outputs.error_output }}"

  # ─────────────────────────────────────────────
  # 3. (Optional) Notify Slack on success/failure
  # ─────────────────────────────────────────────
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [resolve-channel, publish-update]
    if: always() && needs.resolve-channel.outputs.slack_enabled == 'true'
    continue-on-error: true

    steps:
      - name: Notify Slack – success
        if: needs.publish-update.result == 'success'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "✅ *Expo OTA Update Published*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Expo OTA Update Published*\n*Channel:* ${{ needs.resolve-channel.outputs.channel }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack – failure
        if: needs.publish-update.result == 'failure'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "❌ *Expo OTA Update Failed*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Expo OTA Update Failed*\n*Channel:* ${{ needs.resolve-channel.outputs.channel }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
