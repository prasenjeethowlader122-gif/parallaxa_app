openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SocialApp API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: posts
  - name: stories
  - name: likes
  - name: follows
  - name: notifications
  - name: messages
  - name: search
  - name: explore
  - name: saved

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        "200":
          description: Reset token sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 6
              required: [token, password]
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/check-username:
    get:
      operationId: checkUsername
      tags: [auth]
      summary: Check if username is available
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Username availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                required: [available]

  /auth/suggest-usernames:
    get:
      operationId: suggestUsernames
      tags: [auth]
      summary: Get username suggestions
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of suggested usernames
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: string
                required: [suggestions]

  /auth/2fa/setup:
    post:
      operationId: setup2FA
      tags: [auth]
      summary: Setup 2FA (returns QR code URI)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 2FA setup data
          content:
            application/json:
              schema:
                type: object
                properties:
                  qrCodeUri:
                    type: string
                  secret:
                    type: string
                required: [qrCodeUri, secret]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/2fa/enable:
    post:
      operationId: enable2FA
      tags: [auth]
      summary: Enable 2FA after verification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required: [code]
      responses:
        "200":
          description: 2FA enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/2fa/disable:
    post:
      operationId: disable2FA
      tags: [auth]
      summary: Disable 2FA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required: [code]
      responses:
        "200":
          description: 2FA disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/2fa/verify:
    post:
      operationId: verify2FA
      tags: [auth]
      summary: Verify 2FA code during login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                code:
                  type: string
              required: [email, code]
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/verify-request:
    post:
      operationId: requestVerification
      tags: [users]
      summary: Request account verification
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verification request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/users/{userId}/freeze:
    post:
      operationId: freezeUser
      tags: [admin]
      summary: Freeze a user account
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: User frozen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden - Admin only

  /admin/users/{userId}/unfreeze:
    post:
      operationId: unfreezeUser
      tags: [admin]
      summary: Unfreeze a user account
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: User unfrozen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden - Admin only

  /admin/users/{userId}/approve-verification:
    post:
      operationId: approveVerification
      tags: [admin]
      summary: Approve user verification request
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Verification approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden - Admin only

  /admin/posts/{postId}:
    delete:
      operationId: adminDeletePost
      tags: [admin]
      summary: Delete any post as admin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/postId"
      responses:
        "200":
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden - Admin only

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateUser
      tags: [users]
      summary: Update user profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}/posts:
    get:
      operationId: getUserPosts
      tags: [users]
      summary: Get top-level posts by user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: User posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"

  /users/{userId}/stories:
    get:
      operationId: getUserStories
      tags: [users]
      summary: Get active stories by user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: User stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Story"

  /users/{userId}/followers:
    get:
      operationId: getFollowers
      tags: [users]
      summary: Get followers of a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Followers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"

  /users/{userId}/following:
    get:
      operationId: getFollowing
      tags: [users]
      summary: Get users followed by a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Following list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"

  /users/{userId}/follow:
    post:
      operationId: followUser
      tags: [follows]
      summary: Follow a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
    delete:
      operationId: unfollowUser
      tags: [follows]
      summary: Unfollow a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/suggested:
    get:
      operationId: getSuggestedUsers
      tags: [users]
      summary: Get suggested users to follow
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Suggested users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  /posts:
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a post or comment/reply (set parentPostId for reply)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostInput"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{postId}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get post by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/postId"
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post or comment/reply
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/postId"
      responses:
        "200":
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /posts/{postId}/replies:
    get:
      operationId: getReplies
      tags: [posts]
      summary: Get replies/comments of a post
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/postId"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Replies list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{postId}/like:
    post:
      operationId: likePost
      tags: [likes]
      summary: Like a post
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/postId"
      responses:
        "200":
          description: Liked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
    delete:
      operationId: unlikePost
      tags: [likes]
      summary: Unlike a post
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/postId"
      responses:
        "200":
          description: Unliked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /posts/{postId}/save:
    post:
      operationId: savePost
      tags: [saved]
      summary: Save a post
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/postId"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
    delete:
      operationId: unsavePost
      tags: [saved]
      summary: Unsave a post
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/postId"
      responses:
        "200":
          description: Unsaved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /feed:
    get:
      operationId: getFeed
      tags: [posts]
      summary: Get home feed (top-level posts only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Feed posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"

  /explore:
    get:
      operationId: getExplorePosts
      tags: [explore]
      summary: Get explore grid (top-level posts only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Explore posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"

  /stories:
    get:
      operationId: getStories
      tags: [stories]
      summary: Get stories from followed users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stories grouped by user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoryGroup"
    post:
      operationId: createStory
      tags: [stories]
      summary: Create a story
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoryInput"
      responses:
        "201":
          description: Story created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"

  /stories/{storyId}:
    delete:
      operationId: deleteStory
      tags: [stories]
      summary: Delete a story
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/storyId"
      responses:
        "200":
          description: Story deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /stories/{storyId}/view:
    post:
      operationId: viewStory
      tags: [stories]
      summary: Mark story as viewed
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/storyId"
      responses:
        "200":
          description: Story viewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get notifications
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"

  /notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: Get unread notification count
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /conversations:
    get:
      operationId: getConversations
      tags: [messages]
      summary: Get all conversations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conversations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [messages]
      summary: Get single conversation details
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/conversationId"
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{conversationId}/messages:
    get:
      operationId: getMessages
      tags: [messages]
      summary: Get messages in a conversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/conversationId"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /conversations/start:
    post:
      operationId: startConversation
      tags: [messages]
      summary: Start a conversation with a user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationInput"
      responses:
        "201":
          description: Conversation created or existing one returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /search:
    get:
      operationId: search
      tags: [search]
      summary: Search users, posts, hashtags
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [users, posts, hashtags, all]
            default: all
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  /saved:
    get:
      operationId: getSavedPosts
      tags: [saved]
      summary: Get saved posts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Saved posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    postId:
      name: postId
      in: path
      required: true
      schema:
        type: string
    storyId:
      name: storyId
      in: path
      required: true
      schema:
        type: string
    conversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    cursor:
      name: cursor
      in: query
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    UnreadCount:
      type: object
      properties:
        count:
          type: integer
      required: [count]

    RegisterInput:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        displayName:
          type: string
        dateOfBirth:
          type: string
          format: date-time
      required: [username, email, password, displayName, dateOfBirth]

    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
        twoFactorRequired:
          type: boolean
      required: [twoFactorRequired]

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        isVerified:
          type: boolean
        verificationStatus:
          type: string
          enum: [none, pending, verified]
        role:
          type: string
          enum: [user, admin]
        isFrozen:
          type: boolean
        twoFactorEnabled:
          type: boolean
        isPrivate:
          type: boolean
        followersCount:
          type: integer
        followingCount:
          type: integer
        postsCount:
          type: integer
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, username, email, displayName, isVerified, verificationStatus, twoFactorEnabled, isPrivate, followersCount, followingCount, postsCount, createdAt]

    UserSummary:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        isVerified:
          type: boolean
        isFollowing:
          type: boolean
      required: [id, username, displayName, isVerified, isFollowing]

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            isFollowing:
              type: boolean
            isFollowedBy:
              type: boolean
          required: [isFollowing, isFollowedBy]

    UpdateUserInput:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string
        website:
          type: string
        isPrivate:
          type: boolean

    UserPage:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        nextCursor:
          type: string
          nullable: true
      required: [users]

    # Unified Post model — parentPostId null = top-level, set = comment/reply
    Post:
      type: object
      properties:
        id:
          type: string
        author:
          $ref: "#/components/schemas/UserSummary"
        parentPostId:
          type: string
          nullable: true
          description: "null for top-level posts; set to parent post ID for comments/replies"
        content:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        videoUrl:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        hashtags:
          type: array
          items:
            type: string
        likesCount:
          type: integer
        repliesCount:
          type: integer
          description: "Number of direct replies/comments on this post"
        commentsCount:
          type: integer
          description: "Alias for repliesCount"
        isLiked:
          type: boolean
        isSaved:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, author, hashtags, likesCount, repliesCount, isLiked, isSaved, createdAt]

    CreatePostInput:
      type: object
      properties:
        parentPostId:
          type: string
          description: "Set to create a comment/reply on an existing post"
        content:
          type: string
        imageUrl:
          type: string
        videoUrl:
          type: string
        location:
          type: string
        hashtags:
          type: array
          items:
            type: string

    PostPage:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        nextCursor:
          type: string
          nullable: true
      required: [posts]

    Story:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        mediaUrl:
          type: string
        mediaType:
          type: string
          enum: [image, video]
        duration:
          type: integer
          description: Duration in seconds
        viewsCount:
          type: integer
        isViewed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required: [id, userId, mediaUrl, mediaType, duration, viewsCount, isViewed, createdAt, expiresAt]

    StoryGroup:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        stories:
          type: array
          items:
            $ref: "#/components/schemas/Story"
        hasUnviewed:
          type: boolean
      required: [user, stories, hasUnviewed]

    CreateStoryInput:
      type: object
      properties:
        mediaUrl:
          type: string
        mediaType:
          type: string
          enum: [image, video]
        duration:
          type: integer
          default: 5
      required: [mediaUrl, mediaType]

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [like, comment, follow, mention, reply]
        fromUser:
          $ref: "#/components/schemas/UserSummary"
        post:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Post"
        commentContent:
          type: string
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, type, fromUser, isRead, createdAt]

    NotificationPage:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: string
          nullable: true
      required: [notifications]

    Message:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        senderId:
          type: string
        content:
          type: string
          nullable: true
        mediaUrl:
          type: string
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, senderId, isRead, createdAt]

    Conversation:
      type: object
      properties:
        id:
          type: string
        participant:
          $ref: "#/components/schemas/UserSummary"
        lastMessage:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Message"
        unreadCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required: [id, participant, unreadCount, updatedAt]

    MessagePage:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        nextCursor:
          type: string
          nullable: true
      required: [messages]

    SendMessageInput:
      type: object
      properties:
        content:
          type: string
        mediaUrl:
          type: string

    StartConversationInput:
      type: object
      properties:
        userId:
          type: string
      required: [userId]

    SearchResults:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        hashtags:
          type: array
          items:
            $ref: "#/components/schemas/Hashtag"
      required: [users, posts, hashtags]

    Hashtag:
      type: object
      properties:
        name:
          type: string
        postCount:
          type: integer
      required: [name, postCount]