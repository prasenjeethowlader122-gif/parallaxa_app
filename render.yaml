# ============================================================
# render.yaml — Parallaxa deploy config for Render.com
#
# Deploys two separate services:
#   1. parallaxa-backend  — Spring Boot API (Docker, port 8080)
#   2. parallaxa-frontend — Flutter Web     (Docker, port 80)
#
# Docs: https://render.com/docs/infrastructure-as-code
# ============================================================

services:

  # ── Backend: Spring Boot API ─────────────────────────────────
  - type: web
    name: parallaxa-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: parallaxa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT
        value: ""

  # ── Frontend: Flutter Web ────────────────────────────────────
  - type: web
    name: parallaxa-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    plan: free
    envVars:
      - key: API_BASE_URL
        # Replace with your actual backend Render URL after first deploy
        value: https://parallaxa-backend.onrender.com/api

  # ── Managed PostgreSQL ───────────────────────────────────────
databases:
  - name: parallaxa-db
    plan: free
    databaseName: parallaxa
    user: parallaxa
