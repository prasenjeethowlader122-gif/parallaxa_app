# ============================================================
# render.yaml — Parallaxa deploy config for Render.com
#
# Deploys two separate services:
#   1. parallaxa-backend  — Node.js API (Docker)
#   2. parallaxa-frontend — Flutter Web  (Docker)
#
# Docs: https://render.com/docs/infrastructure-as-code
# ============================================================

services:

  # ── Backend: Node.js API ─────────────────────────────────────
  - type: web
    name: parallaxa-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free                # change to 'starter' or higher for production
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: parallaxa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value
      - key: FIREBASE_SERVICE_ACCOUNT
        value: ""             # paste your Firebase JSON here if using Google Sign-In

  # ── Frontend: Flutter Web ────────────────────────────────────
  - type: web
    name: parallaxa-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    plan: free
    envVars:
      - key: API_BASE_URL
        # Replace with your actual backend Render URL after first deploy
        value: https://parallaxa-backend.onrender.com/api

  # ── Managed PostgreSQL ───────────────────────────────────────
databases:
  - name: parallaxa-db
    plan: free                # 'starter' recommended for production (free tier expires 90 days)
    databaseName: parallaxa
    user: parallaxa
